name: monitor-watchdog
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  health:
    if: vars.MONITOR_HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the monitor once daily
        env:
          MONITOR_HEALTH_URL: ${{ vars.MONITOR_HEALTH_URL }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(process.env.MONITOR_HEALTH_URL, { signal: AbortSignal.timeout(30000) });
          if (!response.ok || !(await response.json()).ok) throw new Error('Standalone ingestion monitor is unhealthy');
          console.log('Standalone monitor is healthy');
          JS
