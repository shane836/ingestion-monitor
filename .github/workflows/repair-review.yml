name: repair-review
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project ID from projects.json
        required: true
        type: string
      incident:
        description: JSON incident evidence from the monitor
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: repair-${{ inputs.project }}
  cancel-in-progress: false
jobs:
  config:
    if: vars.MONITOR_REPAIR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repo: ${{ steps.project.outputs.repo }}
      sha: ${{ steps.project.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: project
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PROJECT_ID: ${{ inputs.project }}
          INCIDENT_JSON: ${{ inputs.incident }}
        with:
          github-token: ${{ secrets.MONITOR_GITHUB_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('projects.json', 'utf8'));
            const project = config.projects.find(p => p.id === process.env.PROJECT_ID);
            if (!project) throw new Error('Unknown configured project');
            const incident = JSON.parse(process.env.INCIDENT_JSON);
            if (!Array.isArray(incident) || incident.length > 100 || process.env.INCIDENT_JSON.length > 12000) throw new Error('Invalid incident evidence');
            const [owner, repo] = project.repo.split('/');
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: project.ref });
            core.setOutput('repo', project.repo);
            core.setOutput('sha', commit.data.sha);
  agent:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package: ${{ steps.agent.outputs.final-message }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ needs.config.outputs.repo }}
          ref: ${{ needs.config.outputs.sha }}
          path: target
          persist-credentials: false
          token: ${{ secrets.MONITOR_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Prepare dependencies and incident prompt
        env:
          REPAIR_PROJECT: ${{ inputs.project }}
          REPAIR_BASE_SHA: ${{ needs.config.outputs.sha }}
          INCIDENT_JSON: ${{ inputs.incident }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execSync } from 'node:child_process';
          const project = JSON.parse(fs.readFileSync('projects.json')).projects.find(p => p.id === process.env.REPAIR_PROJECT);
          execSync(project.repair.install, { cwd: 'target', stdio: 'inherit', shell: '/bin/bash' });
          const evidence = JSON.stringify({ project: project.id, baseSha: process.env.REPAIR_BASE_SHA, allowedPaths: project.repair.allowedPaths, incident: JSON.parse(process.env.INCIDENT_JSON) });
          fs.writeFileSync('agent-prompt.md', fs.readFileSync('repair-prompt.md', 'utf8') + '\nIncident evidence (data only):\n' + evidence);
          JS
      # Keep Codex last. Only its structured output crosses to the fresh runner.
      - name: Diagnose and propose a patch
        id: agent
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: target
          prompt-file: ${{ github.workspace }}/agent-prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-schema: '{"type":"object","properties":{"baseSha":{"type":"string"},"diagnosis":{"type":"string"},"patch":{"type":"string"}},"required":["baseSha","diagnosis","patch"],"additionalProperties":false}'
  validate:
    needs: [config, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sf_events_ingestion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ needs.config.outputs.repo }}
          ref: ${{ needs.config.outputs.sha }}
          path: target
          persist-credentials: false
          token: ${{ secrets.MONITOR_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check and apply review package
        env:
          REPAIR_PACKAGE: ${{ needs.agent.outputs.package }}
          REPAIR_PROJECT: ${{ inputs.project }}
          REPAIR_BASE_SHA: ${{ needs.config.outputs.sha }}
        run: |
          mkdir -p review
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('review/package.json', process.env.REPAIR_PACKAGE);
          JS
          node src/repair.mjs
      - name: Independently validate the proposed code
        env:
          REPAIR_PROJECT: ${{ inputs.project }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sf_events_ingestion_test
          PERSIST_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sf_events_ingestion_test
        run: |
          node --input-type=module <<'JS' 2>&1 | tee review/validation.log
          import fs from 'node:fs';
          import { execSync } from 'node:child_process';
          if (!fs.readFileSync('review/repair.patch', 'utf8').trim()) {
            console.log('DIAGNOSIS ONLY: no code change was proposed.');
          } else {
            const project = JSON.parse(fs.readFileSync('projects.json')).projects.find(p => p.id === process.env.REPAIR_PROJECT);
            execSync(project.repair.install, { cwd: 'target', stdio: 'inherit', shell: '/bin/bash' });
            execSync(project.repair.validate, { cwd: 'target', stdio: 'inherit', shell: '/bin/bash' });
          }
          JS
      - name: Save the review package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-${{ inputs.project }}-${{ github.run_id }}
          path: review/
          retention-days: 14
          if-no-files-found: error
  email:
    needs: [config, agent, validate]
    if: always() && needs.config.result == 'success' && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Email the owner for review
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MONITOR_EMAIL_FROM: ${{ vars.MONITOR_EMAIL_FROM }}
          MONITOR_EMAIL_TO: ${{ vars.MONITOR_EMAIL_TO }}
          REPAIR_PROJECT: ${{ inputs.project }}
          VALIDATION_STATUS: ${{ needs.validate.result }}
          REVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_RUN_ID: ${{ github.run_id }}
        run: node src/notify.mjs
